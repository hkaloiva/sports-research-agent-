[project]
name = "sports-research-agent"
version = "0.1.0"
description = "Standalone, zero-cost-by-default sports research application"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18,<5",
    "ddgs>=9.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "click>=8.1",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
sports-research = "sports_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "validation", "planner", "search", "extractor"]
packages = ["sports_research"]
